name: Temporary CADS handoff validation

on:
  push:
    branches:
      - cads/harness-neutral-handoff

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focused handoff and routing tests
        run: python -m unittest tests.test_execution_handoff tests.test_execution_route -v
      - name: Full CADS self-test
        run: python scripts/self_test.py
